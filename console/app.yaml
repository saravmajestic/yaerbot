name: Farm Robot Control
description: Motor control web UI for the farm robot.
ports: []
bricks:
- arduino:web_ui: {}
# The trained Edge Impulse FOMO emitter detector, bound to the app DECLARATIVELY.
# `model:` is the id from App Lab's registry (arduino-app-cli daemon /v1/models).
# This is what makes App Lab start ei-obj-detection-runner with OUR model instead of
# the out-of-the-box yolo-x — and because it lives here rather than being injected by
# the UI, it survives `arduino-app-cli app start` and a reboot. Getting this wrong is
# silent: the app runs, the runner is healthy, and it serves 80 COCO classes.
- arduino:object_detection:
    model: ei-model-1088852-1
icon: 🤖
